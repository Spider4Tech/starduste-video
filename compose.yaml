services:

  php:
    build: .
    command: >
      sh -lc "mkdir -p public/uploads/videos public/uploads/shorts public/uploads/ProfilePictures public/uploads/Banner
      && chmod -R a+rwX public/uploads var
      && php-fpm"
    volumes:
      #- .:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      LIVE_HLS_PUBLIC_BASE_URL: http://localhost:8081/hls
      LIVE_RTMP_PUBLIC_URL: rtmp://localhost:1935/live

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  rtmp:
    image: tiangolo/nginx-rtmp
    ports:
      - "1935:1935"
      - "8081:8080"
    volumes:
      - ./docker/rtmp/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nginx

  database:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: StardusteDB
      MARIADB_USER: Tiramysou
      MARIADB_PASSWORD: MOON-KNIGHT
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  db_data:
